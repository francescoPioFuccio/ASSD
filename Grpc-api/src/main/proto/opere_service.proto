syntax = "proto3";

option java_multiple_files = true;
option java_package = "it.unisannio.opere.grpc"; // Nuovo package specifico per gRPC
option java_outer_classname = "OpereServiceProto";

package it.unisannio.opere.grpc;

// Messaggio di richiesta per getInfoOpera
message GetInfoOperaRequest {
  string operaId = 1;
  string userId = 2; // userId può essere opzionale, ma lo includiamo nel messaggio
}

// Messaggio di risposta per getInfoOpera
message GetInfoOperaResponse {
  // Supponiamo che la risposta sia un JSON string per semplicità,
  // ma idealmente potresti definire qui una struttura più dettagliata
  // che mappi l'output del tuo LLMSimulationService.getInfoOpera.
  // Ad esempio:
  // message OperaInfo {
  //   string id = 1;
  //   string titolo = 2;
  //   string autore = 3;
  //   string descrizione = 4;
  //   repeated string keywords = 5;
  // }
  // OperaInfo operaInfo = 1;

  string jsonResponse = 1; // Per ora manteniamo una stringa JSON
}

// Il servizio gRPC per le opere
service OpereService {
  rpc GetInfoOpera (GetInfoOperaRequest) returns (GetInfoOperaResponse);
  // Aggiungeremo qui altri metodi gRPC man mano che convertiamo le funzioni
}