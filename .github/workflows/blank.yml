name: Build and Push Docker Images

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag per le immagini Docker'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: francescopiofuccio
  REGISTRY_REPO: assd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - name: userdatamodule2
            path: UserDataModule2
          - name: gestionemusei
            path: GestioneMusei
          - name: gestioneopere
            path: GestioneOpere
          - name: gestionequest
            path: GestioneQuest
          - name: gateway
            path: Gateway

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.REGISTRY_REPO }}/${{ matrix.module.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.module.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          echo "✅ Immagine ${{ matrix.module.name }} creata e pubblicata con successo!"
          docker run --rm ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.REGISTRY_REPO }}/${{ matrix.module.name }}:latest echo "Test OK" || true

  deployment-status:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report Status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "🎉 Tutte le immagini sono state create con successo!"
            echo "Le immagini sono disponibili su: ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.REGISTRY_REPO }}"
          else
            echo "❌ Alcuni build sono falliti"
            exit 1
          fi
