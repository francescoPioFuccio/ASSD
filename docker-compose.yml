services:
  # -------------------------------------------------------------
  # SERVIZIO MYSQL
  # -------------------------------------------------------------
  mysql_db:
    image: mysql:8.0
    container_name: museoapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: _ASSDproject
      MYSQL_DATABASE: luca3
      MYSQL_USER: luca
      MYSQL_PASSWORD: luca
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------
  # KAFKA E ZOOKEEPER
  # -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: museoapp-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - app_network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: museoapp-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------
  # MODULI BACKEND
  # -------------------------------------------------------------
  userdatamodule2-backend:
    build:
      context: ./UserDataModule2
      dockerfile: Dockerfile
    container_name: museoapp-userdatamodule2
    ports:
      - "8088:8085"
      - "50053:50053"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: luca3
      DB_USER: luca
      DB_PASSWORD: luca
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -ln | grep :50053 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  gestionemusei-backend:
    build:
      context: ./GestioneMusei
      dockerfile: Dockerfile
    container_name: museoapp-gestionemusei
    ports:
      - "8086:8085"
      - "50055:50055"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: luca3
      DB_USER: luca
      DB_PASSWORD: luca
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -ln | grep :50055 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  gestioneopere-backend:
    build:
      context: ./GestioneOpere
      dockerfile: Dockerfile
    container_name: museoapp-gestioneopere
    ports:
      - "8087:8085"
      - "50052:50052"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: luca3
      DB_USER: luca
      DB_PASSWORD: luca
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -ln | grep :50052 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  gestionequest-backend:
    build:
      context: ./GestioneQuest
      dockerfile: Dockerfile
    container_name: museoapp-gestionequest
    ports:
      - "8089:8085"
      - "50054:50054"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: luca3
      DB_USER: luca
      DB_PASSWORD: luca
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -ln | grep :50054 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway_backend:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: museoapp-gateway
    ports:
      - "8091:8085"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: luca3
      DB_USER: luca
      DB_PASSWORD: luca
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Variabili di ambiente per i servizi gRPC
      USER_GRPC_HOST: userdatamodule2-backend
      OPERE_GRPC_HOST: gestioneopere-backend
      QUEST_GRPC_HOST: gestionequest-backend
      MUSEI_GRPC_HOST: gestionemusei-backend
    depends_on:
      mysql_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      userdatamodule2-backend:
        condition: service_started
      gestionemusei-backend:
        condition: service_started
      gestioneopere-backend:
        condition: service_started
      gestionequest-backend:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

volumes:
  mysql_data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:

networks:
  app_network:
    driver: bridge